<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports Calendar</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Sports Calendar</h1>
      <p id="subtitle">Times shown in <strong>Central Time</strong></p>
      <div id="filters"></div>
    </header>

    <main>
      <div class="toolbar">
        <button id="prev" aria-label="Previous month">&lsaquo;</button>
        <h2 id="month-label"></h2>
        <button id="next" aria-label="Next month">&rsaquo;</button>
        <button id="today" class="today-btn">Today</button>
      </div>

      <div id="grid" class="grid">Loading&hellip;</div>
      <section id="detail" hidden></section>
    </main>

    <footer>
      <p id="generated"></p>
    </footer>

    <!-- Generated by scripts/fetch-*.mjs. Loaded as a script (not fetch) so the
         page works opened directly from disk (file://). -->
    <script src="data/events.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
